name: Phase 4 ERA5 Environmental Comparison
on:
  workflow_dispatch:
    inputs:
      diagnostics_run_id:
        description: GitHub Actions run ID containing btv-era5-environmental-diagnostics
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Phase 2 diagnostics
        uses: actions/download-artifact@v4
        with:
          name: btv-era5-environmental-diagnostics
          run-id: ${{ inputs.diagnostics_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: diagnostics
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install pandas numpy matplotlib
      - name: Run Phase 4 comparison
        run: |
          python severe_weather_research/processing/phase4_environmental_comparison.py \
            --input diagnostics/hourly_environmental_parameters.csv \
            --out-dir phase4_output
      - name: Upload Phase 4 results
        uses: actions/upload-artifact@v4
        with:
          name: btv-era5-phase4-comparison
          path: phase4_output/
          retention-days: 30
