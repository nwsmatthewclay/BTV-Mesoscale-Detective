name: SHARPpy Adapter Validation

on:
  pull_request:
    paths:
      - "mesoscale/sharppy_adapter.py"
      - "mesoscale/environment-sharppy.yml"
      - "mesoscale/tests/test_sharppy_adapter.py"
      - ".github/workflows/sharppy_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharppy-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: btv-sharppy
          environment-file: mesoscale/environment-sharppy.yml
          auto-activate: true
      - name: Validate SHARPpy adapter
        shell: bash -el {0}
        run: PYTHONPATH=. pytest -q mesoscale/tests/test_sharppy_adapter.py
