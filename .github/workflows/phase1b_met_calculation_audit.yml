name: Phase 1B Meteorological Calculation Audit

on:
  workflow_dispatch:
    inputs:
      processing_run_id:
        description: GitHub Actions run ID containing the 30-case profiles and environmental diagnostics artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  met-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download 30-case processing artifact
        uses: actions/download-artifact@v4
        with:
          name: btv-era5-30case-validation-and-processing
          run-id: ${{ inputs.processing_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: era5_artifact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install calculation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r severe_weather_research/processing/requirements.txt tabulate

      - name: Locate required artifact files
        id: files
        run: |
          profile_file=$(find era5_artifact -type f -name hourly_profiles.csv -print -quit)
          diagnostic_file=$(find era5_artifact -type f -name hourly_environmental_parameters.csv -print -quit)
          test -n "$profile_file"
          test -n "$diagnostic_file"
          echo "profiles=$profile_file" >> "$GITHUB_OUTPUT"
          echo "diagnostics=$diagnostic_file" >> "$GITHUB_OUTPUT"

      - name: Syntax check audit and calculation modules
        run: |
          python -m py_compile severe_weather_research/processing/phase1b_met_calculation_audit.py
          python -m py_compile severe_weather_research/processing/calculate_parameters.py

      - name: Run Phase 1B calculation reproducibility audit
        run: |
          cd severe_weather_research/processing
          python phase1b_met_calculation_audit.py \
            --profiles "${{ steps.files.outputs.profiles }}" \
            --diagnostics "${{ steps.files.outputs.diagnostics }}" \
            --out-dir "${{ github.workspace }}/phase1b_output"

      - name: Upload Phase 1B audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btv-era5-phase1b-met-calculation-audit
          path: phase1b_output/
          retention-days: 30
          if-no-files-found: warn
