name: RAP BTV Ingestion Smoke Test

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mesoscale/validate_rap_ingestion.py"
      - "!mesoscale/data/fields/**"
      - "mesoscale/process_grib.py"
      - "mesoscale/extract_profile.py"
      - "mesoscale/diagnostics.py"
      - ".github/workflows/rap_ingestion_smoke.yml"

permissions:
  contents: write

concurrency:
  group: mesoscale-data-updates
  cancel-in-progress: false

jobs:
  rap-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GRIB decoding dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy xarray cfgrib eccodes metpy
      - name: Download and decode current RAP pressure-level product
        run: python mesoscale/validate_rap_ingestion.py
      - name: Publish verified RAP fields and KBTV profile
        run: |
          mkdir -p mesoscale/data/fields
          cp mesoscale/data/ingestion_smoke/rap_f*_btv.json.gz mesoscale/data/fields/rap_latest.json.gz
          cp mesoscale/data/ingestion_smoke/rap_kbtv_profile.json mesoscale/data/fields/rap_kbtv_profile.json
          cp mesoscale/data/ingestion_smoke/rap_station_profiles.json mesoscale/data/fields/rap_station_profiles.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mesoscale/data/fields/
          if git diff --cached --quiet; then
            echo "Published RAP data unchanged."
            exit 0
          fi
          git commit -m "Publish verified latest RAP BTV fields"
          git pull --rebase origin main
          git push
      - name: Upload ingestion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rap-btv-ingestion-smoke-report
          path: mesoscale/data/ingestion_smoke/
          if-no-files-found: ignore
