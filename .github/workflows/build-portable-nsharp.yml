name: Build BTV NSHARP Portable Runtime (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "portable-sharppy/**"
      - "native-sharppy/btv_cwa_latest.xml"
      - "native-sharppy/btv_cwa.csv"
      - "native-sharppy/btv_observed.csv"
      - ".github/workflows/build-portable-nsharp.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: portable-sharppy/environment-windows.yml
          activate-environment: btv-nsharp-build
          auto-activate-base: false
      - name: Validate SHARPpy, Qt, and BTV data
        shell: pwsh
        run: |
          python -c "import sharppy, runsharp.full_gui, PySide2, numpy; print('SHARPpy import OK; NumPy', numpy.__version__)"
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET; p=Path('native-sharppy/btv_cwa_latest.xml'); root=ET.parse(p).getroot(); sources=root.findall('datasource'); assert len(sources) == 5; assert any(s.attrib.get('name')=='Observed' and s.attrib.get('observed')=='true' for s in sources); assert Path('native-sharppy/btv_observed.csv').is_file(); print('Four model feeds plus Observed validated')"
          python -c "import csv; rows=list(csv.DictReader(open('native-sharppy/btv_cwa.csv', newline='', encoding='utf-8'))); assert len(rows) >= 20; assert any(r['icao']=='KBTV' for r in rows); print(len(rows), 'BTV CWA sites validated')"
          python -c "import csv; rows=list(csv.DictReader(open('native-sharppy/btv_observed.csv', newline='', encoding='utf-8'))); assert len(rows)>=8; assert any(r['srcid']=='BTV' for r in rows); print(len(rows), 'regional observed sounding stations validated')"
      - name: Smoke test launcher in build environment
        shell: pwsh
        run: |
          python portable-sharppy/launcher.py --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Launcher smoke test failed" }
      - name: Pack relocatable runtime folder (no PyInstaller EXE)
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "BTV-NSHARP-Portable"
          $runtime = Join-Path $package "runtime"
          New-Item -ItemType Directory -Force -Path $package, $runtime | Out-Null
          conda-pack -p $env:CONDA_PREFIX -o runtime-packed.zip --format zip
          Expand-Archive -Path runtime-packed.zip -DestinationPath $runtime -Force
          Copy-Item portable-sharppy/launcher.py $package/launcher.py
          Copy-Item portable-sharppy/START_SHARPpy.bat $package/START_SHARPpy.bat
          Copy-Item portable-sharppy/README.md $package/README.txt
          Copy-Item native-sharppy $package/native-sharppy -Recurse -Force
          & "$runtime/Scripts/conda-unpack.exe"
          if ($LASTEXITCODE -ne 0) { throw "conda-unpack failed" }
          & "$runtime/python.exe" $package/launcher.py --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Post-relocation smoke test failed" }
          Compress-Archive -Path "$package/*" -DestinationPath BTV-NSHARP-Windows-Portable.zip -Force
          Get-FileHash BTV-NSHARP-Windows-Portable.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  BTV-NSHARP-Windows-Portable.zip" } | Set-Content BTV-NSHARP-Windows-Portable.sha256
          Get-ChildItem $package -Recurse -File | ForEach-Object { $_.FullName.Substring($package.Length + 1) } | Sort-Object | Set-Content BTV-NSHARP-Windows-Portable-manifest.txt
      - name: Upload portable package and verification files
        uses: actions/upload-artifact@v4
        with:
          name: BTV-NSHARP-Windows-Portable
          path: |
            BTV-NSHARP-Windows-Portable.zip
            BTV-NSHARP-Windows-Portable.sha256
            BTV-NSHARP-Windows-Portable-manifest.txt
          if-no-files-found: error
          retention-days: 30
      - name: Attach package to published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BTV-NSHARP-Windows-Portable.zip
            BTV-NSHARP-Windows-Portable.sha256
            BTV-NSHARP-Windows-Portable-manifest.txt
