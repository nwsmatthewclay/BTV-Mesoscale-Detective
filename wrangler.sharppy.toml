name = "btv-sharppy-api"
main = "workers/sounding-api/src/index.js"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[containers]]
class_name = "SharpPyContainer"
image = "./Dockerfile.sharppy"
max_instances = 1
instance_type = "basic"

[[durable_objects.bindings]]
name = "SHARPPY_API"
class_name = "SharpPyContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SharpPyContainer"]

[observability]
enabled = true
