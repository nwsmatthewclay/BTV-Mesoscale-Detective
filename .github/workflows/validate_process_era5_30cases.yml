name: Validate and Process ERA5 30-Case Dataset

on:
  push:
    paths:
      - ".github/workflows/validate_process_era5_30cases.yml"
  workflow_dispatch:
    inputs:
      acquisition_run_id:
        description: Acquisition workflow run ID containing btv-era5-first-five artifact (artifact name retained for compatibility)
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ACQUISITION_RUN_ID: ${{ github.event.inputs.acquisition_run_id || '45783596790' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download 30-case acquisition artifact
        uses: actions/download-artifact@v4
        with:
          name: btv-era5-first-five
          run-id: ${{ github.event.inputs.acquisition_run_id || '45783596790' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: era5_artifact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research processing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r severe_weather_research/processing/requirements.txt

      - name: Compile processing scripts
        run: |
          python -m py_compile severe_weather_research/processing/validate_era5_pilot.py
          python -m py_compile severe_weather_research/processing/extract_profiles.py
          python -m py_compile severe_weather_research/processing/calculate_parameters.py
          python -m py_compile severe_weather_research/processing/qc_environmental_parameters.py
          python -m py_compile severe_weather_research/processing/phase4_environmental_comparison.py
          python -m py_compile severe_weather_research/processing/phase5_pilot_evaluation.py

      - name: Audit case manifest and acquired files
        run: |
          echo "Manifest cases:"
          python - <<'PY'
          import csv
          from pathlib import Path
          manifest=list(csv.DictReader(Path('severe_weather_research/acquisition/case_manifest.csv').open()))
          assert len(manifest)==30, f'Expected 30 manifest cases; found {len(manifest)}'
          assert len({r['case_id'] for r in manifest})==30, 'Duplicate case IDs'
          raw=Path('era5_artifact/raw')
          pressure=[]; single=[]; missing=[]
          for r in manifest:
              d=raw/r['case_id']/r['event_date_utc']
              p=d/'pressure_levels_full.grib'; s=d/'single_levels.grib'
              if p.exists(): pressure.append(p)
              else: missing.append(str(p))
              if s.exists(): single.append(s)
              else: missing.append(str(s))
          print(f'Cases: {len(manifest)}; pressure files: {len(pressure)}; single-level files: {len(single)}')
          if missing: raise SystemExit('Missing files:\\n'+'\\n'.join(missing))
          assert len(pressure)==30 and len(single)==30
          PY

      - name: GRIB signature and size audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('era5_artifact/raw')
          rows=[]
          for p in sorted(root.rglob('*.grib')):
              with p.open('rb') as f: sig=f.read(4)
              rows.append({'path':str(p),'bytes':p.stat().st_size,'signature_ok':sig==b'GRIB'})
          bad=[r for r in rows if r['bytes']<=0 or not r['signature_ok']]
          print(json.dumps({'grib_files':len(rows),'total_bytes':sum(r['bytes'] for r in rows),'invalid_files':bad},indent=2))
          assert len(rows)==60, f'Expected 60 GRIB files; found {len(rows)}'
          assert not bad, f'Invalid GRIB signatures or empty files: {bad}'
          Path('validation_output').mkdir(exist_ok=True)
          Path('validation_output/grib_signature_audit.json').write_text(json.dumps(rows,indent=2))
          PY

      - name: Decode GRIB metadata for all 60 files
        run: |
          python severe_weather_research/processing/validate_era5_pilot.py \
            --raw-dir era5_artifact/raw \
            --output validation_output/grib_metadata_validation.json \
            --decode

      - name: Extract hourly profiles and Skew-T diagrams for all 30 cases
        run: |
          python severe_weather_research/processing/extract_profiles.py \
            --raw-dir era5_artifact/raw \
            --output-dir profile_output

      - name: Verify 30-case profile output
        run: |
          python - <<'PY'
          import json, csv
          from pathlib import Path
          report=json.loads(Path('profile_output/decode_profile_report.json').read_text())
          rows=list(csv.DictReader(Path('profile_output/hourly_profiles.csv').open()))
          statuses=report['cases']
          failed=[r for r in statuses if r.get('status')!='ok']
          cases=sorted({r['case_id'] for r in rows})
          sites=sorted({r['site'] for r in rows})
          print(json.dumps({'cases_ok':len(statuses)-len(failed),'cases_failed':failed,'profile_rows':len(rows),'unique_cases':len(cases),'sites':sites,'skewt_pngs':len(list(Path('profile_output/skewt').glob('*.png')))},indent=2))
          assert not failed, f'Profile extraction failed: {failed}'
          assert len(cases)==30, f'Only {len(cases)} cases represented'
          assert len(sites)==6, f'Expected 6 sites; found {sites}'
          assert len(rows)>=30*6*20, f'Unexpectedly low profile row count: {len(rows)}'
          PY

      - name: Calculate environmental diagnostics
        run: |
          python severe_weather_research/processing/calculate_parameters.py \
            --profiles profile_output/hourly_profiles.csv \
            --out-dir diagnostics_output

      - name: Verify diagnostics coverage
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          report=json.loads(Path('diagnostics_output/parameter_report.json').read_text())
          df=pd.read_csv('diagnostics_output/hourly_environmental_parameters.csv')
          print(json.dumps({'diagnostic_rows':len(df),'cases':len(report['cases']),'sites':report['sites'],'hours_per_case_site':report['time_count_per_case_site'],'valid_rates':report['valid_rates'],'diagnostic_errors':len(report['diagnostic_errors'])},indent=2))
          assert len(report['cases'])==30, 'Expected 30 cases in diagnostics'
          assert len(df)>=30*6*20, 'Diagnostic output unexpectedly sparse'
          assert report['time_count_per_case_site']>=20, 'Expected approximately hourly data'
          PY

      - name: Phase 3 environmental QC
        run: |
          python severe_weather_research/processing/qc_environmental_parameters.py \
            --input diagnostics_output/hourly_environmental_parameters.csv \
            --out-dir qc_output

      - name: Phase 4 event comparison
        run: |
          python severe_weather_research/processing/phase4_environmental_comparison.py \
            --input diagnostics_output/hourly_environmental_parameters.csv \
            --out-dir phase4_output

      - name: Phase 5 pilot evaluation (expanded sample)
        run: |
          python severe_weather_research/processing/phase5_pilot_evaluation.py \
            --input diagnostics_output/hourly_environmental_parameters.csv \
            --out-dir phase5_output

      - name: Upload full 30-case validation and processing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btv-era5-30case-validation-and-processing
          path: |
            validation_output/
            profile_output/
            diagnostics_output/
            qc_output/
            phase4_output/
            phase5_output/
          retention-days: 30
          if-no-files-found: warn
