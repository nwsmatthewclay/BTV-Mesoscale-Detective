name: Native SHARPpy Integration Validation

on:
  push:
    paths:
      - "native-sharppy/**"
      - "mesoscale/sharppy_*.py"
      - "mesoscale/browser_adjustments.py"
      - "mesoscale/bufkit_feed.py"
      - "mesoscale/tests/test_sharppy_*.py"
      - "mesoscale/tests/test_bufkit_feed.py"
      - ".github/workflows/native-sharppy-validation.yml"
  pull_request:
    paths:
      - "native-sharppy/**"
      - "mesoscale/sharppy_*.py"
      - "mesoscale/browser_adjustments.py"
      - "mesoscale/bufkit_feed.py"
      - "mesoscale/tests/test_sharppy_*.py"
      - "mesoscale/tests/test_bufkit_feed.py"
      - ".github/workflows/native-sharppy-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sharppy-ci
          create-args: >-
            python=3.10
            sharppy=1.4.0
            pyside2
            requests
            python-dateutil
            pytest
            fastapi
          cache-environment: true
      - name: Check Worker JavaScript syntax
        run: node --check native-sharppy/worker/src/index.js
      - name: Test archived BUFKIT Worker behavior
        run: node native-sharppy/worker/test-worker.mjs
      - name: Validate native SHARPpy data-source integration
        shell: micromamba-shell {0}
        run: python native-sharppy/test_native_config.py
      - name: Run actual SHARPpy adapter and service tests
        shell: micromamba-shell {0}
        run: python -m pytest -q mesoscale/tests/test_sharppy_adapter.py mesoscale/tests/test_sharppy_service.py mesoscale/tests/test_bufkit_feed.py
