name: ERA5 Pilot Environmental Diagnostics
on:
  workflow_dispatch:
    inputs:
      profile_run_id:
        description: GitHub Actions run ID containing btv-era5-profile-pilot
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download profile artifact
        uses: actions/download-artifact@v4
        with:
          name: btv-era5-profile-pilot
          run-id: ${{ inputs.profile_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: profile_artifact
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r severe_weather_research/processing/requirements.txt
      - name: Validate script syntax
        run: python -m py_compile severe_weather_research/processing/calculate_parameters.py
      - name: Confirm profile artifact
        run: test -s profile_artifact/hourly_profiles.csv
      - name: Calculate hourly environmental diagnostics
        run: |
          python severe_weather_research/processing/calculate_parameters.py \
            --profiles profile_artifact/hourly_profiles.csv \
            --out-dir diagnostics_output
      - name: Upload diagnostics and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btv-era5-environmental-diagnostics
          path: diagnostics_output/
          retention-days: 30
          if-no-files-found: warn
