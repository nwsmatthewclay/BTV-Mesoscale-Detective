name: RAP BTV Ingestion and Forecast Archive

on:
  workflow_run:
    workflows: ["Mesoscale Model Discovery and Validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mesoscale-data-updates
  cancel-in-progress: false

jobs:
  rap-ingestion:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      published: ${{ steps.publish.outputs.published }}
      manifest_changed: ${{ steps.refresh.outputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GRIB decoding dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy xarray cfgrib eccodes metpy pytest
      - name: Run mesoscale unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q mesoscale/tests
      - name: Refresh RAP, HRRR and RRFS model discovery manifest for scheduled and manual runs
        id: refresh
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python mesoscale/discover_models.py --days-back 2 --index-latest
            git add mesoscale/data/model_manifest.json
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Model discovery manifest unchanged after attempt $attempt."
              exit 0
            fi
            git commit -m "Refresh RAP, HRRR and RRFS model manifest"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Manifest push raced with another main update; retrying attempt $attempt." >&2
          done
          echo "Could not publish the refreshed model manifest after three attempts." >&2
          exit 1
      - name: Check whether a newer complete RAP cycle needs publication
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from mesoscale.build_rap_forecast_archive import archive_needs_update

          model_manifest = json.loads(Path("mesoscale/data/model_manifest.json").read_text(encoding="utf-8"))
          archive_path = Path("mesoscale/data/fields/forecast/forecast_manifest.json")
          existing = json.loads(archive_path.read_text(encoding="utf-8")) if archive_path.exists() else None
          needs_update, target_cycle = archive_needs_update(
              model_manifest, existing, (0, 3, 6, 9, 12, 15), archive_root=archive_path.parent
          )
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              needs_update = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"needs_update={'true' if needs_update else 'false'}\n")
          print(f"Latest complete RAP cycle: {target_cycle}; archive update required: {needs_update}")
          PY
      - name: Download and decode current RAP hybrid-level product
        if: steps.freshness.outputs.needs_update == 'true'
        run: python mesoscale/validate_rap_ingestion.py
      - name: Build verified multi-hour RAP forecast archive
        if: steps.freshness.outputs.needs_update == 'true'
        run: python mesoscale/build_rap_forecast_archive.py --hours 0,3,6,9,12,15
      - name: Verify regional RAP archive coverage before publishing
        if: steps.freshness.outputs.needs_update == 'true'
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          from mesoscale.process_grib import DOMAIN, validate_grid_coverage

          root = Path("mesoscale/data/forecast_archive")
          manifest = json.loads((root / "forecast_manifest.json").read_text(encoding="utf-8"))
          if manifest.get("domain") != DOMAIN:
              raise SystemExit(f"RAP archive manifest domain mismatch: {manifest.get('domain')!r}")
          for entry in manifest.get("hours", []):
              grid_path = root / entry["grid_file"]
              with gzip.open(grid_path, "rt", encoding="utf-8") as stream:
                  payload = json.load(stream)
              if payload.get("domain") != DOMAIN:
                  raise SystemExit(f"RAP grid domain mismatch: {grid_path}")
              validate_grid_coverage(payload.get("grids"), DOMAIN)
          if len(manifest.get("hours", [])) != 6:
              raise SystemExit("RAP archive must contain all six verified forecast hours")
          print(f"Verified {len(manifest['hours'])} RAP forecast grids over {DOMAIN}")

      - name: Publish verified RAP fields and KBTV profile
        id: publish
        if: steps.freshness.outputs.needs_update == 'true'
        run: |
          # Rebase before staging generated outputs. This avoids binary merge
          # conflicts when a queued hourly run checked out an older gzip grid.
          git pull --rebase origin main
          mkdir -p mesoscale/data/fields
          cp mesoscale/data/ingestion_smoke/rap_f*_btv.json.gz mesoscale/data/fields/rap_latest.json.gz
          cp mesoscale/data/ingestion_smoke/rap_kbtv_profile.json mesoscale/data/fields/rap_kbtv_profile.json
          cp mesoscale/data/ingestion_smoke/rap_station_profiles.json mesoscale/data/fields/rap_station_profiles.json
          mkdir -p mesoscale/data/fields/forecast/fields
          rm -f mesoscale/data/fields/forecast/rap_f*.json.gz mesoscale/data/fields/forecast/rap_f*_stations.json
          cp mesoscale/data/forecast_archive/fields/rap_f*.json.gz mesoscale/data/fields/forecast/fields/
          cp mesoscale/data/forecast_archive/fields/rap_f*_stations.json mesoscale/data/fields/forecast/fields/
          cp mesoscale/data/forecast_archive/forecast_manifest.json mesoscale/data/fields/forecast/forecast_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mesoscale/data/fields/
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Published RAP data unchanged."
            exit 0
          fi
          git commit -m "Publish verified latest RAP BTV fields"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Upload ingestion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rap-btv-ingestion-smoke-report
          path: mesoscale/data/ingestion_smoke/
          if-no-files-found: ignore

  deploy-pages:
    needs: rap-ingestion
    if: needs.rap-ingestion.outputs.published == 'true' || needs.rap-ingestion.outputs.manifest_changed == 'true' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest published main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Wait for GitHub Pages artifact metadata
        run: sleep 10
      - name: Deploy updated model data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
