name: Deploy BTV SHARPpy API Container

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to repository Actions secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID to repository Actions secrets."; exit 1; }
          test -n "${{ secrets.SHARPPY_DESKTOP_TOKEN }}" || { echo "::error::Add SHARPPY_DESKTOP_TOKEN to repository Actions secrets."; exit 1; }
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy Python SHARPpy Container API and native desktop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.sharppy.toml
      - name: Install native desktop access token as a Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHARPPY_DESKTOP_TOKEN: ${{ secrets.SHARPPY_DESKTOP_TOKEN }}
        run: echo -n "$SHARPPY_DESKTOP_TOKEN" | npx wrangler secret put SHARPPY_DESKTOP_TOKEN --config wrangler.sharppy.toml
