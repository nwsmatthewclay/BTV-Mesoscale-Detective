name: Phase 1 Foundation Audit

on:
  workflow_dispatch:
    inputs:
      acquisition_run_id:
        description: GitHub Actions run ID containing the 30-case ERA5 raw-data artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  foundation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download ERA5 raw artifact
        uses: actions/download-artifact@v4
        with:
          name: btv-era5-30case-validation-and-processing
          run-id: ${{ inputs.acquisition_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: era5_artifact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run foundation audit
        run: |
          args=(--out-dir phase1_output --raw-dir era5_artifact)
          profile_file=$(find era5_artifact -type f -name hourly_profiles.csv -print -quit)
          diagnostic_file=$(find era5_artifact -type f -name hourly_environmental_parameters.csv -print -quit)
          if [ -n "$profile_file" ]; then args+=(--profiles "$profile_file"); fi
          if [ -n "$diagnostic_file" ]; then args+=(--diagnostics "$diagnostic_file"); fi
          echo "Artifact contents:"
          find era5_artifact -maxdepth 4 -type f | sort
          python severe_weather_research/processing/phase1_foundation_audit.py "${args[@]}"

      - name: Upload Phase 1 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btv-severe-weather-phase1-foundation-audit
          path: phase1_output/
          retention-days: 30
          if-no-files-found: warn
