name: Mesoscale Model Discovery and Validation

on:
  push:
    branches: [main]
    paths:
      - "mesoscale/discover_models.py"
      - ".github/workflows/mesoscale_model_discovery.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: mesoscale-data-updates
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest requests numpy metpy
      - name: Run mesoscale unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q mesoscale/tests

  discover:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install discovery dependencies
        run: python -m pip install --upgrade requests
      - name: Rebase before generating the model manifest
        run: git pull --rebase origin main
      - name: Discover latest RAP, HRRR and RRFS products
        run: python mesoscale/discover_models.py --days-back 2 --index-latest
      - name: Commit updated model manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mesoscale/data/model_manifest.json
          if git diff --cached --quiet; then
            echo "Model manifest unchanged."
            exit 0
          fi
          git commit -m "Update RAP, HRRR and RRFS discovery manifest"
          git push
