name: Mesoscale Browser Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - regional-viewer-foundation
    paths:
      - "index.html"
      - "mesoscale.html"
      - "mesoscale/browser_tests/**"
      - ".github/workflows/mesoscale_browser_smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "mesoscale.html"
      - "mesoscale/browser_tests/**"
      - ".github/workflows/mesoscale_browser_smoke.yml"

permissions:
  contents: read

concurrency:
  group: mesoscale-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request or feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Start local dashboard server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/mesoscale-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mesoscale-http.log
          exit 1
      - name: Exercise every published RAP and HRRR forecast hour
        run: pytest -q mesoscale/browser_tests
