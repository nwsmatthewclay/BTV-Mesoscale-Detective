name: RAP Projection and Frontogenesis Probe

on:
  pull_request:
    paths:
      - "mesoscale/probe_rap_projection.py"
      - "mesoscale/process_grib.py"
      - "mesoscale/frontogenesis.py"
      - "mesoscale/cross_section.py"
      - "mesoscale/build_rap_forecast_archive.py"
      - "mesoscale/data/model_manifest.json"
      - ".github/workflows/rap_projection_probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rap-projection-probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only GRIB analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy xarray cfgrib eccodes metpy
      - name: Download one RAP F00 product and inspect native grid metadata
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python mesoscale/probe_rap_projection.py
