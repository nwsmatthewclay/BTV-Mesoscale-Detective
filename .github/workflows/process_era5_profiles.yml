name: Decode ERA5 Pilot and Build Profiles
on:
  workflow_dispatch:
    inputs:
      acquisition_run_id:
        description: GitHub Actions run ID containing btv-era5-first-five artifact
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download acquisition artifact
        uses: actions/download-artifact@v4
        with:
          name: btv-era5-first-five
          run-id: ${{ inputs.acquisition_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: era5_artifact
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install processing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r severe_weather_research/processing/requirements.txt
      - name: Decode and extract profiles
        run: |
          python severe_weather_research/processing/extract_profiles.py --raw-dir era5_artifact/raw --output-dir profile_output
      - name: Upload decoded profiles and Skew-T plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btv-era5-profile-pilot
          path: profile_output/
          retention-days: 30
          if-no-files-found: warn
