name: RAP BTV Ingestion Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rap-btv-ingestion-smoke
  cancel-in-progress: false

jobs:
  rap-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GRIB decoding dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy xarray cfgrib eccodes
      - name: Download and decode current RAP pressure-level product
        run: python mesoscale/validate_rap_ingestion.py
      - name: Upload ingestion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rap-btv-ingestion-smoke-report
          path: mesoscale/data/ingestion_smoke/
          if-no-files-found: ignore
