name: Deploy Native SHARPpy BUFKIT Worker

on:
  workflow_dispatch:
  push:
    paths:
      - "native-sharppy/worker/**"
      - ".github/workflows/deploy-native-sharppy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Worker to Cloudflare
        working-directory: native-sharppy/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add CLOUDFLARE_API_TOKEN in repository Actions secrets."; exit 1; }
          npx --yes wrangler@4 deploy
