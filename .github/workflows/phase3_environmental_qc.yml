name: Phase 3 ERA5 Environmental QC
on:
  workflow_dispatch:
    inputs:
      diagnostics_run_id:
        description: GitHub Actions run ID containing btv-era5-environmental-diagnostics
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Phase 2 diagnostics
        uses: actions/download-artifact@v4
        with:
          name: btv-era5-environmental-diagnostics
          run-id: ${{ inputs.diagnostics_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: diagnostics
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install QC dependencies
        run: python -m pip install pandas numpy
      - name: Run Phase 3 QC
        run: |
          python severe_weather_research/processing/qc_environmental_parameters.py \
            --input diagnostics/hourly_environmental_parameters.csv \
            --out-dir qc_output
      - name: Upload QC results
        uses: actions/upload-artifact@v4
        with:
          name: btv-era5-phase3-qc
          path: qc_output/
          retention-days: 30
