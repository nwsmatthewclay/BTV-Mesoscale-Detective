name: Deploy BTV Mesoscale Detective to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "mesoscale.html"
      - "mesoscale/**"
      # Tile generation and deployment are owned by model_tile_render.yml.
      - "!mesoscale/data/model_tiles/**"
      - "!mesoscale/render_model_tiles.py"
      - "!mesoscale/tests/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Wait for GitHub Pages artifact metadata
        run: sleep 10
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
