name: Phase 1C Physical Plausibility and Cross-file Audit

on:
  workflow_dispatch:
    inputs:
      processing_run_id:
        description: GitHub Actions run ID containing the 30-case profiles and environmental diagnostics artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  plausibility-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download 30-case processing artifact
        uses: actions/download-artifact@v4
        with:
          name: btv-era5-30case-validation-and-processing
          run-id: ${{ inputs.processing_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: era5_artifact

      - name: Locate profile and diagnostic files
        id: files
        run: |
          profile_file=$(find "${GITHUB_WORKSPACE}/era5_artifact" -type f -name hourly_profiles.csv -print -quit)
          diagnostic_file=$(find "${GITHUB_WORKSPACE}/era5_artifact" -type f -name hourly_environmental_parameters.csv -print -quit)
          test -n "$profile_file"
          test -n "$diagnostic_file"
          echo "profiles=$profile_file" >> "$GITHUB_OUTPUT"
          echo "diagnostics=$diagnostic_file" >> "$GITHUB_OUTPUT"
          echo "Profiles: $profile_file"
          echo "Diagnostics: $diagnostic_file"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy

      - name: Syntax check and run Phase 1C
        run: |
          python -m py_compile severe_weather_research/processing/phase1c_physical_plausibility_audit.py
          python severe_weather_research/processing/phase1c_physical_plausibility_audit.py \
            --profiles "${{ steps.files.outputs.profiles }}" \
            --diagnostics "${{ steps.files.outputs.diagnostics }}" \
            --out-dir phase1c_output

      - name: Upload Phase 1C report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btv-era5-phase1c-physical-plausibility-audit
          path: phase1c_output/
          retention-days: 30
          if-no-files-found: warn
