name: Phase 1 Foundation Audit

on:
  workflow_dispatch:
    inputs:
      acquisition_run_id:
        description: GitHub Actions run ID containing the 30-case ERA5 raw-data artifact
        required: true
        type: string
      profile_artifact_run_id:
        description: Optional run ID containing hourly_profiles.csv or diagnostics CSV artifact
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  foundation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download ERA5 raw artifact
        uses: actions/download-artifact@v4
        with:
          name: btv-era5-first-five
          run-id: ${{ inputs.acquisition_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: era5_artifact

      - name: Download optional processed profile artifact
        if: ${{ inputs.profile_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: btv-era5-30case-validation-and-processing
          run-id: ${{ inputs.profile_artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: processed_artifact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run foundation audit
        run: |
          args=(--out-dir phase1_output --raw-dir era5_artifact/raw)
          if [ -f processed_artifact/profile_output/hourly_profiles.csv ]; then
            args+=(--profiles processed_artifact/profile_output/hourly_profiles.csv)
          fi
          if [ -f processed_artifact/diagnostics_output/hourly_environmental_parameters.csv ]; then
            args+=(--diagnostics processed_artifact/diagnostics_output/hourly_environmental_parameters.csv)
          fi
          python severe_weather_research/processing/phase1_foundation_audit.py "${args[@]}"

      - name: Upload Phase 1 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btv-severe-weather-phase1-foundation-audit
          path: phase1_output/
          retention-days: 30
          if-no-files-found: warn
