name: Mesoscale Model Discovery and Validation

on:
  push:
    branches: [main]
    paths:
      - "mesoscale/discover_models.py"
      - "mesoscale/validate_rap_ingestion.py"
      - "mesoscale/build_rap_forecast_archive.py"
      - "mesoscale/process_grib.py"
      - "mesoscale/extract_profile.py"
      - "mesoscale/diagnostics.py"
      - "mesoscale/download_subset.py"
      - "mesoscale/validate_hrrr_ingestion.py"
      - "mesoscale/validate_hrrr_archive.py"
      - "mesoscale/hrrr_tests/**"
      - "mesoscale/data/model_manifest.json"
      - "mesoscale/tests/**"
      - ".github/workflows/mesoscale_model_discovery.yml"
      - ".github/workflows/rap_ingestion_smoke.yml"
      - ".github/workflows/hrrr_ingestion_smoke.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mesoscale-model-discovery
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest requests numpy metpy
      - name: Run mesoscale unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q mesoscale/tests mesoscale/hrrr_tests

  discover:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manifest_changed: ${{ steps.commit_manifest.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install discovery dependencies
        run: python -m pip install --upgrade requests
      - name: Discover and publish manifest with race-safe retry
        id: commit_manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python mesoscale/discover_models.py --days-back 2 --index-latest
            git add mesoscale/data/model_manifest.json
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Model manifest unchanged after attempt $attempt."
              exit 0
            fi
            git commit -m "Update RAP, HRRR and RRFS discovery manifest"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push raced with another main update; refreshing and retrying attempt $attempt." >&2
          done
          echo "Could not publish model manifest after three attempts." >&2
          exit 1

  deploy-pages:
    needs: discover
    if: needs.discover.outputs.manifest_changed == 'true'
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest published main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for GitHub Pages artifact metadata
        run: sleep 10
      - name: Deploy updated model discovery manifest to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
