name: HRRR BTV Surface Ingestion and Archive

on:
  workflow_run:
    workflows: ["RAP BTV Ingestion and Forecast Archive"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesoscale-hrrr-smoke
  cancel-in-progress: false

jobs:
  hrrr-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      needs_update: ${{ steps.freshness.outputs.needs_update }}
      valid_times: ${{ steps.freshness.outputs.valid_times }}
      rap_cycle: ${{ steps.freshness.outputs.rap_cycle }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out latest repository state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HRRR decoding dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy xarray cfgrib eccodes metpy pytest
      - name: Run RAP and HRRR validation tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q mesoscale/tests mesoscale/hrrr_tests
      - name: Check whether a newer complete HRRR cycle needs publication
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from mesoscale.validate_hrrr_archive import archive_needs_update

          model_manifest = json.loads(Path("mesoscale/data/model_manifest.json").read_text(encoding="utf-8"))
          rap_path = Path("mesoscale/data/fields/forecast/forecast_manifest.json")
          rap_archive = json.loads(rap_path.read_text(encoding="utf-8"))
          if rap_archive.get("model") != "RAP" or (rap_archive.get("quality") or {}).get("status") != "passed":
              raise SystemExit("A verified published RAP archive is required for HRRR valid-time alignment")
          rap_hours = rap_archive.get("hours") or []
          target_valid_times = [item.get("valid_time_utc") for item in rap_hours]
          if len(target_valid_times) < 4 or any(not value for value in target_valid_times):
              raise SystemExit("RAP archive must provide at least four valid times for HRRR alignment")
          archive_path = Path("mesoscale/data/fields/hrrr/hrrr_forecast_manifest.json")
          existing = json.loads(archive_path.read_text(encoding="utf-8")) if archive_path.exists() else None
          needs_update, target_cycle = archive_needs_update(
              model_manifest, existing, (0, 3, 6, 9),
              valid_times=tuple(target_valid_times), archive_root=archive_path.parent
          )
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              needs_update = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"needs_update={'true' if needs_update else 'false'}\n")
              output.write(f"valid_times={','.join(target_valid_times)}\n")
              output.write(f"rap_cycle={rap_archive['model_cycle_utc']}\n")
          print(
              f"Latest HRRR cycle covering RAP valid times: {target_cycle}; "
              f"RAP cycle: {rap_archive['model_cycle_utc']}; update required: {needs_update}"
          )
          PY
      - name: Download and validate HRRR at the published RAP valid times
        if: steps.freshness.outputs.needs_update == 'true'
        env:
          TARGET_VALID_TIMES: ${{ steps.freshness.outputs.valid_times }}
          RAP_CYCLE: ${{ steps.freshness.outputs.rap_cycle }}
        run: |
          python mesoscale/validate_hrrr_archive.py \
            --valid-times "$TARGET_VALID_TIMES" \
            --reference-rap-cycle "$RAP_CYCLE"
      - name: Upload verified HRRR surface archive artifact
        if: always() && steps.freshness.outputs.needs_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hrrr-btv-ingestion-smoke
          path: mesoscale/data/ingestion_smoke/hrrr/
          if-no-files-found: ignore
          retention-days: 7

  publish-hrrr:
    needs: hrrr-smoke
    if: needs.hrrr-smoke.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out latest published main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download verified HRRR archive artifact
        uses: actions/download-artifact@v4
        with:
          name: hrrr-btv-ingestion-smoke
          path: hrrr-artifact
      - name: Re-verify archive metadata and decoded grids
        run: |
          python - <<'PY'
          import gzip
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("hrrr-artifact")
          manifest_path = root / "hrrr_forecast_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("model") != "HRRR" or manifest.get("product") != "surface":
              raise SystemExit("Refusing to publish a non-HRRR surface archive")
          if (manifest.get("quality") or {}).get("status") != "passed":
              raise SystemExit("Refusing to publish an archive without passed quality status")
          hours = manifest.get("hours") or []
          rap_manifest = json.loads(
              Path("mesoscale/data/fields/forecast/forecast_manifest.json").read_text(encoding="utf-8")
          )
          rap_valid_times = [item.get("valid_time_utc") for item in (rap_manifest.get("hours") or [])]
          alignment = manifest.get("valid_time_alignment") or {}
          if len(hours) < 4 or len(hours) != len(rap_valid_times) or any(not value for value in rap_valid_times):
              raise SystemExit("Refusing to publish an incomplete RAP/HRRR valid-time set")
          if [item.get("valid_time_utc") for item in hours] != rap_valid_times:
              raise SystemExit("Refusing to publish HRRR grids that do not match RAP valid times")
          if (alignment.get("reference_model") != "RAP"
                  or alignment.get("reference_cycle_utc") != rap_manifest.get("model_cycle_utc")
                  or alignment.get("valid_times_utc") != rap_valid_times):
              raise SystemExit("Refusing to publish HRRR data aligned to a different RAP archive")

          for item in hours:
              grid_path = root / item["grid_file"]
              if not grid_path.is_file() or grid_path.stat().st_size < 1000:
                  raise SystemExit(f"Missing or undersized HRRR grid: {grid_path}")
              with gzip.open(grid_path, "rt", encoding="utf-8") as stream:
                  payload = json.load(stream)
              if (payload.get("model") != "HRRR"
                      or payload.get("model_cycle_utc") != manifest["model_cycle_utc"]
                      or int(payload.get("forecast_hour", -1)) != int(item["forecast_hour"])):
                  raise SystemExit(f"HRRR grid metadata mismatch: {grid_path}")
              if not payload.get("grids") or not payload.get("fields"):
                  raise SystemExit(f"HRRR grid has no decoded data: {grid_path}")
              names = {field.get("short_name") for field in payload["fields"].values()}
              if not {"2t", "10u", "10v"}.issubset(names):
                  raise SystemExit(f"HRRR required surface fields missing: {grid_path}")

          manifest["publishing"] = True
          manifest["published_utc"] = datetime.now(timezone.utc).isoformat()
          manifest_path.write_text(
              json.dumps(manifest, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(
              f"Verified HRRR cycle {manifest['model_cycle_utc']} "
              f"hours {[item['forecast_hour'] for item in hours]} for publication"
          )
          PY
      - name: Rebase and publish verified HRRR surface fields
        run: |
          git pull --rebase origin main
          python - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("hrrr-artifact/hrrr_forecast_manifest.json").read_text(encoding="utf-8"))
          rap = json.loads(Path("mesoscale/data/fields/forecast/forecast_manifest.json").read_text(encoding="utf-8"))
          expected = [item.get("valid_time_utc") for item in (rap.get("hours") or [])]
          alignment = artifact.get("valid_time_alignment") or {}
          actual = [item.get("valid_time_utc") for item in (artifact.get("hours") or [])]
          if (alignment.get("reference_model") != "RAP"
                  or alignment.get("reference_cycle_utc") != rap.get("model_cycle_utc")
                  or alignment.get("valid_times_utc") != expected
                  or actual != expected):
              raise SystemExit("RAP archive changed during HRRR publication; refusing stale valid-time alignment")
          print(f"Final publish guard passed for RAP cycle {rap['model_cycle_utc']}")
          PY
          mkdir -p mesoscale/data/fields/hrrr
          find mesoscale/data/fields/hrrr -maxdepth 1 -type f -name 'hrrr_f*_btv.json.gz' -delete
          cp hrrr-artifact/hrrr_f*_btv.json.gz mesoscale/data/fields/hrrr/
          cp hrrr-artifact/hrrr_forecast_manifest.json mesoscale/data/fields/hrrr/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mesoscale/data/fields/hrrr/
          if git diff --cached --quiet; then
            echo "Published HRRR archive unchanged."
            exit 0
          fi
          git commit -m "Publish verified HRRR BTV surface archive"
          git push

  browser-smoke:
    needs: [hrrr-smoke, publish-hrrr]
    if: >-
      always() &&
      needs.hrrr-smoke.result == 'success' &&
      (needs.publish-hrrr.result == 'success' || needs.publish-hrrr.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest published main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Start local dashboard server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/mesoscale-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mesoscale-http.log
          exit 1
      - name: Exercise every published RAP and HRRR forecast hour
        run: pytest -q mesoscale/browser_tests

  deploy-pages:
    needs: publish-hrrr
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest published main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Wait for GitHub Pages artifact metadata
        run: sleep 10
      - name: Deploy updated HRRR data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
