name: RRFS BTV Regional Subset Smoke Test

on:
  workflow_run:
    workflows: ["Mesoscale Model Discovery and Validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rrfs-btv-subset-smoke
  cancel-in-progress: false

jobs:
  rrfs-btv-subset-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out latest discovered main branch
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install RRFS subset dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy eccodes pytest
      - name: Run indexed-range and BTV-subset unit tests
        run: python -m pytest -q mesoscale/tests/test_rrfs_range_smoke.py mesoscale/tests/test_rrfs_btv_subset.py
      - name: Fetch, decode, and write the BTV-masked RRFS subset
        run: |
          python mesoscale/rrfs_btv_subset.py \
            --manifest mesoscale/data/model_manifest.json \
            --output-dir "$RUNNER_TEMP/rrfs_btv_subset"
      - name: Upload non-published RRFS BTV subset artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rrfs-btv-subset-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rrfs_btv_subset/
          if-no-files-found: ignore
          retention-days: 7
