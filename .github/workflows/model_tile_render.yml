name: Render RAP and HRRR Model Tiles
# Automatically publish every eligible 2-D field in each verified forecast archive.

on:
  push:
    branches: [main]
    paths:
      - "mesoscale/render_model_tiles.py"
      - "mesoscale/tests/test_model_tiles.py"
      - ".github/workflows/model_tile_render.yml"
  workflow_run:
    workflows:
      - RAP BTV Ingestion and Forecast Archive
      - HRRR BTV Surface Ingestion and Archive
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mesoscale-model-tile-render
  cancel-in-progress: false

jobs:
  render-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out latest model archives
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib pillow pyproj pytest
      - name: Run renderer tests
        run: pytest -q mesoscale/tests/test_model_tiles.py
      - name: Render verified RAP and HRRR surface fields
        run: |
          set -euo pipefail
          render_archive() {
            local manifest="$1"
            local model="$2"
            [[ -f "$manifest" ]] || return 0
            python - "$manifest" "$model" <<'PY'
          import gzip, json, subprocess, sys
          from pathlib import Path
          import numpy as np

          manifest_path, model = Path(sys.argv[1]), sys.argv[2]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("model") != model:
              raise SystemExit(f"Expected {model} archive in {manifest_path}")
          if (manifest.get("quality") or {}).get("status") != "passed":
              raise SystemExit(f"Refusing to render unverified {model} archive")
          root = manifest_path.parent
          rendered = 0
          skipped = []
          for hour in manifest.get("hours", []):
              grid_path = root / hour["grid_file"]
              if not grid_path.is_file():
                  raise SystemExit(f"Missing {model} grid {grid_path}")
              with gzip.open(grid_path, "rt", encoding="utf-8") as stream:
                  payload = json.load(stream)
              if (payload.get("model") != model
                      or payload.get("model_cycle_utc") != manifest.get("model_cycle_utc")
                      or int(payload.get("forecast_hour", -1)) != int(hour["forecast_hour"])):
                  raise SystemExit(f"{model} grid provenance mismatch: {grid_path}")
              if hour.get("valid_time_utc") and payload.get("valid_time_utc") != hour["valid_time_utc"]:
                  raise SystemExit(f"{model} grid valid time mismatch: {grid_path}")
              for field_key, field in payload.get("fields", {}).items():
                  data = np.squeeze(np.asarray(field.get("data"), dtype=float))
                  if data.ndim != 2:
                      continue
                  grid = payload.get("grids", {}).get(field.get("grid_id"), {})
                  lat = np.asarray(grid.get("latitude", []), dtype=float)
                  lon = np.asarray(grid.get("longitude", []), dtype=float)
                  if data.shape != lat.shape or data.shape != lon.shape:
                      skipped.append((hour["forecast_hour"], field_key, "field/grid shape mismatch"))
                      continue
                  valid = np.isfinite(data) & np.isfinite(lat) & np.isfinite(lon)
                  if int(valid.sum()) < 12 or float(np.nanmax(data[valid]) - np.nanmin(data[valid])) <= 0:
                      skipped.append((hour["forecast_hour"], field_key, "insufficient or constant valid data"))
                      continue
                  command = [
                      sys.executable, "mesoscale/render_model_tiles.py",
                      "--input", str(grid_path), "--field", field_key,
                      "--zoom-min", "3", "--zoom-max", "7"
                  ]
                  short_name = field.get("short_name")
                  # Convert only recognized near-surface products. Other levels
                  # retain their native model units and remain explicitly labelled.
                  if short_name in ("2t", "2d"):
                      command += ["--offset", "-273.15", "--display-units", "°C",
                                  "--display-label", "2-m temperature" if short_name == "2t" else "2-m dewpoint"]
                  elif short_name == "gust":
                      command += ["--scale", "1.943844", "--display-units", "kt", "--display-label", "Wind gust"]
                  elif short_name == "vis":
                      command += ["--scale", "0.001", "--display-units", "km", "--display-label", "Visibility"]
                  result = subprocess.run(command, text=True, capture_output=True)
                  if result.returncode:
                      message = (result.stderr or result.stdout or "").strip()
                      if "Invalid color range" in message or "Fewer than 12 valid grid cells" in message:
                          skipped.append((hour["forecast_hour"], field_key, message.splitlines()[-1]))
                          print(f"Skipping non-renderable {model} field {field_key}: {message.splitlines()[-1]}")
                          continue
                      raise RuntimeError(f"Tile rendering failed for {model} {field_key}: {message[-3000:]}")
                  rendered += 1
          print(f"{model}: rendered {rendered} 2-D fields across {len(manifest.get('hours', []))} forecast hours")
          if skipped:
              print(f"{model}: skipped {len(skipped)} fields with invalid geometry/data; first examples: {skipped[:12]}")
          if rendered == 0:
              raise SystemExit(f"No eligible 2-D {model} fields were rendered")
          PY
          }
          render_archive mesoscale/data/fields/forecast/forecast_manifest.json RAP
          render_archive mesoscale/data/fields/hrrr/hrrr_forecast_manifest.json HRRR
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("mesoscale/data/model_tiles")
          products = []
          for product_path in sorted(root.glob("**/product.json")):
              product = json.loads(product_path.read_text(encoding="utf-8"))
              product["product_path"] = product_path.relative_to(root).as_posix()
              products.append(product)
          root.mkdir(parents=True, exist_ok=True)
          catalog = {
              "schema_version": 1,
              "generated_utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "tile_scheme": "XYZ",
              "products": products,
          }
          (root / "catalog.json").write_text(json.dumps(catalog, indent=2) + "\n", encoding="utf-8")
          models = {product["model"] for product in products}
          for model in ("RAP", "HRRR"):
              model_products = [product for product in products if product["model"] == model]
              if not model_products:
                  raise SystemExit(f"No eligible 2-D {model} model tile products were generated")
                    print(f"Published {len(products)} initial model tile products")
          PY
      - name: Publish tile archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mesoscale/data/model_tiles/
          if git diff --cached --quiet; then
            echo "Model tiles unchanged."
            exit 0
          fi
          git commit -m "Publish zoomable RAP and HRRR model tiles"
          # Other ingestion/discovery workflows can update main while rendering.
          # Rebase and retry the push so a harmless concurrent commit cannot
          # strand a completed tile render in the runner.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after refreshing main."
          done
          echo "Unable to publish tile archive after five push attempts."
          exit 1
