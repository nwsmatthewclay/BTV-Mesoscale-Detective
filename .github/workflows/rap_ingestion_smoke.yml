name: RAP BTV Ingestion and Forecast Archive

on:
  workflow_run:
    workflows: ["Mesoscale Model Discovery and Validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mesoscale-data-updates
  cancel-in-progress: false

jobs:
  rap-ingestion:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out latest main branch
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Miniforge with SHARPpy and RAP decoder dependencies
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: btv-sharppy
          environment-file: mesoscale/environment-sharppy.yml
          auto-activate: true
      - name: Run mesoscale unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q mesoscale/tests
      - name: Refresh RAP, HRRR and RRFS model discovery manifest for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python mesoscale/discover_models.py --days-back 2 --index-latest
            git add mesoscale/data/model_manifest.json
            if git diff --cached --quiet; then
              echo "Model discovery manifest unchanged after attempt $attempt."
              exit 0
            fi
            git commit -m "Refresh RAP, HRRR and RRFS model manifest"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Manifest push raced with another main update; retrying attempt $attempt." >&2
          done
          echo "Could not publish the refreshed model manifest after three attempts." >&2
          exit 1
      - name: Check whether a newer complete RAP cycle needs publication
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from mesoscale.build_rap_forecast_archive import archive_needs_update
          from mesoscale.rap_freshness_report import build_rap_freshness_report

          model_manifest = json.loads(Path("mesoscale/data/model_manifest.json").read_text(encoding="utf-8"))
          archive_path = Path("mesoscale/data/fields/forecast/forecast_manifest.json")
          existing = json.loads(archive_path.read_text(encoding="utf-8")) if archive_path.exists() else None
          needs_update, target_cycle = archive_needs_update(
              model_manifest, existing, (0, 3, 6, 9, 12, 15), archive_root=archive_path.parent
          )
          # Rebuild the already-published cycle once when its station profiles
          # lack SHARPpy enrichment. This avoids waiting for a new model cycle
          # before parcel, Bunkers-motion, shear and SRH diagnostics appear.
          profile_path = Path("mesoscale/data/fields/rap_kbtv_profile.json")
          profile = json.loads(profile_path.read_text(encoding="utf-8")) if profile_path.exists() else None
          profile_matches_archive = bool(
              profile and existing
              and profile.get("model_cycle_utc") == existing.get("model_cycle_utc")
          )
          sharppy_refresh_required = bool(
              existing and (
                  not profile_matches_archive
                  or (profile.get("sharppy") or {}).get("status") != "passed"
              )
          )
          if sharppy_refresh_required:
              needs_update = True
              target_cycle = target_cycle or existing.get("model_cycle_utc")
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              needs_update = True
          report = build_rap_freshness_report(
              event_name=os.environ.get("EVENT_NAME", "unknown"),
              target_cycle=target_cycle,
              existing_archive=existing,
              needs_update=needs_update,
          )
          report_path = Path(os.environ["RUNNER_TEMP"]) / "rap-freshness-report.json"
          report_path.write_text(
              json.dumps(report, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"needs_update={'true' if needs_update else 'false'}\n")
          print(json.dumps(report, indent=2))
          print(f"RAP freshness decision report: {report_path}")
          PY
      - name: Download and decode current RAP hybrid-level product
        if: steps.freshness.outputs.needs_update == 'true'
        run: python mesoscale/validate_rap_ingestion.py
      - name: Build verified multi-hour RAP forecast archive
        if: steps.freshness.outputs.needs_update == 'true'
        run: python mesoscale/build_rap_forecast_archive.py --hours 0,3,6,9,12,15
      - name: Publish verified RAP fields and KBTV profile
        if: steps.freshness.outputs.needs_update == 'true'
        run: |
          # Rebase before staging generated outputs. This avoids binary merge
          # conflicts when a queued hourly run checked out an older gzip grid.
          git pull --rebase origin main
          mkdir -p mesoscale/data/fields
          cp mesoscale/data/ingestion_smoke/rap_f*_btv.json.gz mesoscale/data/fields/rap_latest.json.gz
          cp mesoscale/data/ingestion_smoke/rap_kbtv_profile.json mesoscale/data/fields/rap_kbtv_profile.json
          cp mesoscale/data/ingestion_smoke/rap_station_profiles.json mesoscale/data/fields/rap_station_profiles.json
          mkdir -p mesoscale/data/fields/forecast/fields
          rm -f mesoscale/data/fields/forecast/rap_f*.json.gz mesoscale/data/fields/forecast/rap_f*_stations.json
          cp mesoscale/data/forecast_archive/fields/rap_f*.json.gz mesoscale/data/fields/forecast/fields/
          cp mesoscale/data/forecast_archive/fields/rap_f*_stations.json mesoscale/data/fields/forecast/fields/
          cp mesoscale/data/forecast_archive/forecast_manifest.json mesoscale/data/fields/forecast/forecast_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mesoscale/data/fields/
          if git diff --cached --quiet; then
            echo "Published RAP data unchanged."
            exit 0
          fi
          git commit -m "Publish verified latest RAP BTV fields"
          git push
      - name: Upload RAP freshness and ingestion report
        if: always() && steps.freshness.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: rap-ingestion-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rap-freshness-report.json
            mesoscale/data/ingestion_smoke/
          if-no-files-found: ignore
          retention-days: 7
